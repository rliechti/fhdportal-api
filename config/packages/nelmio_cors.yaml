nelmio_cors:
    defaults:
        # CORS_ALLOW_ORIGIN is matched as a regex: it MUST be anchored (^...$),
        # otherwise e.g. 'fega\.swiss' would also match 'fega.swiss.evil.com'.
        origin_regex: true
        allow_origin: []  # Empty by default
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Authorization', 'Content-Type', 'Accept', 'X-Access-Token','X-Forwarded-Prefix']
        expose_headers: ['Link', 'Content-Disposition']
        max_age: 3600

    paths:
        '^/api/':  # Match /api/schemas exactly
            allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
            # ... rest inherits
